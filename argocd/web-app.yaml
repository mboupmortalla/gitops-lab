apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name:  web-app-env
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - webEnv: dev
          - webEnv: prod
  template:
    metadata:
      name: 'web-app-{{.webEnv}}'
    spec:
      project: web
      source:
        path: 'app/web/overlays/{{.webEnv}}'
        repoURL: git@github.com:mboupmortalla/gitops-lab.git/
        targetRevision: main
      destination:
        namespace: 'web-{{.webEnv}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true