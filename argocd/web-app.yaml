apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    path: app/web
    repoURL: git@github.com:mboupmortalla/gitops-lab.git/
    targetRevision: main
  destination:
    namespace: gitops-demo
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    