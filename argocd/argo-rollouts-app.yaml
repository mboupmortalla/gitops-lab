apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetVersion: 2.43.8
    helm:
      releaseName: argo-rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true