apiVersion:  autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: gitops-demo
spec:
  maxReplicas: 5
  minReplicas: 2
  scaleTargetRef:
    name: web
    kind: Rollout
    apiVersion: argoproj.io/v1alpha1
  metrics:
    - resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
      type: Resource