apiVersion:  autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: gitops-demo
spec:
  maxReplicas: 5
  minReplicas: 2
  scaleTargetRef:
    name: web
    kind: Deployment
    apiVersion: apps/v1
  metrics:
    - resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
      type: Resource