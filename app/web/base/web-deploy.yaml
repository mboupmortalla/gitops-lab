# apiVersion: apps/v1
# kind: Deployment
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
  namespace: gitops-demo
spec:
  spec:
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}              
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100 
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - image:  nginx:alpine
          name:  nginx-container
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
         

---
kind: Service
apiVersion: v1
metadata:
  name:  web
  namespace: gitops-demo
spec:
  selector:
    app:  web
  type:  ClusterIP
  ports:
  - name:  http
    port:  80
    targetPort:  80