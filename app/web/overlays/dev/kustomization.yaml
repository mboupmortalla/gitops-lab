apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/
  - success-rate.yaml

namespace: web-dev

images:
  - name: nginx
    newName: nginx
    newTag: 1.28-alpine

patches:
  - target:
      kind: HorizontalPodAutoscaler
      namespace: gitops-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 5

  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: web-dev
      - op: add
        path: /metadata/labels/istio-injection
        value: enabled

  - target:
      kind: Rollout
    patch: |-
      - op: add
        path: /spec/strategy/canary/analysis
        value:
          templates:
            - templateName: success-rate
          startingStep: 1            # démarre après le 1er setWeight (20 %)