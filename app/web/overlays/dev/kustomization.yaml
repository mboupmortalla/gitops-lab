apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/
  - success-rate.yaml
  - nginx-500.yaml

namespace: web-dev

images:
  - name: nginx
    newName: nginx
    newTag: 1.28-alpine

patches:
  - target:
      kind: HorizontalPodAutoscaler
      namespace: gitops-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 5

  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: web-dev
      - op: add
        path: /metadata/labels/istio-injection
        value: enabled

  - target:
      kind: Rollout
    patch: |-
      - op: add
        path: /spec/strategy/canary/analysis
        value:
          templates:
            - templateName: success-rate
          startingStep: 1           

      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: nginx-conf
            configMap:
              name: nginx-500                         
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf                         