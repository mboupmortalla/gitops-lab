apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/

namespace: web-dev

images:
  - name: nginx
    newName: nginx
    newTag: 1.28-alpine

patches:
  - target:
      kind: HorizontalPodAutoscaler
      namespace: gitops-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 5

      