apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  metrics:
    - name: success-rate
      interval: 30s            # mesure toutes les 30 s
      failureLimit: 1          # plus d'1 mesure en échec = abandon
      successCondition: result[0] >= 0.95     # ton seuil, entre 0 et 1
      provider:
        prometheus:
          address: http://prometheus.istio-system:9090
          query: |
            sum(rate(istio_requests_total{destination_service_namespace="web-dev",reporter="destination",response_code!~"5.."}[1m]))/sum(rate(istio_requests_total{destination_service_namespace="web-dev",reporter="destination"}[1m]))