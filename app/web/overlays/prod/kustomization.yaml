apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/
  - db-password-sealed.yaml

namespace: web-prod
nameSuffix: -prod

images:
  - name: nginx
    newName: nginx
    newTag: 1.27-alpine

patches:
  - target:
      kind: HorizontalPodAutoscaler
      namespace: gitops-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 5
        
      